<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard BBVA FO Risk - Control de Horas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK de Inicio de Sesión de Google -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800" onclick="closeDropdownIfOutside(event)">

  <!-- PANTALLA DE LOGIN -->
  <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center border border-slate-200">
      <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 font-bold text-2xl">
        DB
      </div>
      <h2 class="text-2xl font-bold mb-2 text-slate-800">Dashboard BBVA FO Risk</h2>
      <p class="text-slate-500 text-sm mb-6">Inicia sesión con tu cuenta corporativa para acceder</p>
      
      <div id="g_id_onload"
        data-client_id="949020942947-bq1qa64aovf7rfkfuc9iqf0tdg4p0jl1.apps.googleusercontent.com"
        data-callback="handleCredentialResponse"
        data-auto_prompt="false">
      </div>
      
      <div class="flex justify-center my-4">
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with"></div>
      </div>

      <div id="loginSpinner" class="hidden my-4 text-slate-500 text-sm flex items-center justify-center gap-2">
        <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Verificando permisos...</span>
      </div>

      <p id="loginError" class="text-red-500 text-sm mt-4 p-3 bg-red-50 rounded-lg hidden border border-red-200"></p>
    </div>
  </div>

  <!-- DASHBOARD PRINCIPAL -->
  <div id="dashboardSection" class="hidden flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between p-4 shadow-lg">
      <div>
        <div class="flex items-center gap-3 mb-8 px-2">
          <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center font-bold">R</div>
          <h1 class="text-lg font-bold text-slate-100">FO Risk Portal</h1>
        </div>
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-2 mb-3">Módulos</p>
        <nav id="navMenu" class="space-y-1">
          <!-- Menú dinámico -->
        </nav>
      </div>
      <div class="border-t border-slate-800 pt-4 px-2">
        <p id="userInfo" class="text-sm font-semibold text-slate-200"></p>
        <p id="userEmail" class="text-xs text-slate-400 mb-3 truncate"></p>
        <button onclick="logout()" class="w-full text-left text-xs text-red-400 hover:text-red-300 font-medium transition">
          ← Cerrar Sesión
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8 bg-slate-50">
      <header class="flex justify-between items-center mb-6">
        <div>
          <h2 id="currentTabTitle" class="text-3xl font-bold text-slate-800">Control de Horas</h2>
          <p class="text-slate-500 text-sm">Visión por proyectos, personas e imputaciones diarias</p>
        </div>
      </header>

      <!-- BARRA DE FILTROS -->
      <div id="filterBar" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6 hidden">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
          
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Fecha Inicio</label>
            <input type="date" id="filterStartDate" onchange="applyFilters()" 
              class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Fecha Fin</label>
            <input type="date" id="filterEndDate" onchange="applyFilters()" 
              class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div class="relative" id="projectDropdownContainer">
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Filtrar Proyectos</label>
            <button onclick="toggleProjectDropdown(event)" id="projectDropdownBtn"
              class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-left text-slate-700 flex justify-between items-center">
              <span id="selectedProjectsLabel">Todos los proyectos</span>
              <span class="text-xs">▼</span>
            </button>
            <div id="projectDropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-300 rounded-lg shadow-lg z-50 max-h-48 overflow-y-auto p-2">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Buscar</label>
            <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Empleado o Proyecto..." 
              class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
          </div>

        </div>
      </div>

      <!-- TARJETAS KPIS -->
      <div id="kpiContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6 hidden">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <p class="text-xs font-bold text-slate-400 uppercase">Total Horas Imputadas</p>
          <h3 id="kpiTotalHours" class="text-2xl font-bold text-blue-600 mt-1">0 h</h3>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <p class="text-xs font-bold text-slate-400 uppercase">Proyectos Activos</p>
          <h3 id="kpiTotalProjects" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <p class="text-xs font-bold text-slate-400 uppercase">Empleados Imputando</p>
          <h3 id="kpiTotalEmployees" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
        </div>
      </div>

      <!-- CONTENEDOR TABLA JERÁRQUICA -->
      <div id="contentArea">
        <p class="text-slate-500">Cargando datos...</p>
      </div>
    </main>
  </div>

  <script>
    // ⚠️ REEMPLAZA CON TUS DATOS REALES:
    const API_URL = "https://script.google.com/macros/s/AKfycbzkpLvn1DOhiCe17EtRr8A147zkWc4bY54ujFseuZBYB1n_Ym6S0mNqaAYHiS8uI3le/exec"; 
    
    let currentUser = null;
    let rawData = [];
    let processedRecords = [];
    let selectedProjects = [];

    function apiCall(params) {
      return new Promise((resolve, reject) => {
        const callbackName = 'cb_' + Math.floor(Math.random() * 1000000);
        const script = document.createElement('script');
        
        let query = `?callback=${callbackName}`;
        for (let key in params) {
          query += `&${key}=${encodeURIComponent(params[key])}`;
        }
        
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("Timeout de respuesta del servidor."));
        }, 15000);

        function cleanup() {
          clearTimeout(timer);
          if (window[callbackName]) delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.src = API_URL + query;
        script.onerror = function() {
          cleanup();
          reject(new Error("Error de red."));
        };

        document.body.appendChild(script);
      });
    }

    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c => 
          '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
        ).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    async function handleCredentialResponse(response) {
      const errorEl = document.getElementById('loginError');
      const spinner = document.getElementById('loginSpinner');
      errorEl.classList.add('hidden');
      spinner.classList.remove('hidden');
      
      const payload = parseJwt(response.credential);
      if (!payload || !payload.email) {
        showError("Error al procesar la autenticación de Google.");
        spinner.classList.add('hidden');
        return;
      }

      try {
        const result = await apiCall({ action: "verifyUser", email: payload.email });
        spinner.classList.add('hidden');

        if (result.success) {
          currentUser = result.user;
          initDashboard();
        } else {
          showError(result.message);
        }
      } catch (err) {
        spinner.classList.add('hidden');
        showError("Error de conexión. Asegúrate de haber publicado 'Nueva versión' en Apps Script.");
      }
    }

    function showError(msg) {
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
    }

    function initDashboard() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      
      document.getElementById('userInfo').textContent = currentUser.nombre;
      document.getElementById('userEmail').textContent = `${currentUser.email} (${currentUser.rol})`;

      const defaultTabs = ['[Controls]-Daily hour allocation'];
      const allowedTabs = currentUser.pestanas === 'ALL' 
        ? defaultTabs 
        : currentUser.pestanas.split(',').map(t => t.trim());

      const navMenu = document.getElementById('navMenu');
      navMenu.innerHTML = '';

      allowedTabs.forEach(tab => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition flex items-center gap-2";
        btn.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-400"></span> Control de Horas`;
        btn.onclick = () => loadHoursData(tab);
        navMenu.appendChild(btn);
      });

      if (allowedTabs.length > 0) loadHoursData(allowedTabs[0]);
    }

    async function loadHoursData(tabName) {
      document.getElementById('currentTabTitle').textContent = "Control de Horas";
      document.getElementById('filterBar').classList.add('hidden');
      document.getElementById('kpiContainer').classList.add('hidden');
      
      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = '<div class="p-8 text-center text-slate-500">Procesando registros de horas...</div>';

      try {
        const result = await apiCall({ action: "getData", sheet: tabName });

        if (result.success && result.data) {
          rawData = result.data;
          processHoursData(rawData);
          populateProjectFilter();
          document.getElementById('filterBar').classList.remove('hidden');
          document.getElementById('kpiContainer').classList.remove('hidden');
          applyFilters();
        } else {
          contentArea.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-lg border border-red-200">Error: ${result.message}</div>`;
        }
      } catch (e) {
        contentArea.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-lg border border-red-200">Error al obtener la información de horas.</div>`;
      }
    }

    // PARSEADOR DE DATOS
    function processHoursData(data) {
      processedRecords = [];

      if (!data || data.length === 0) return;

      const sample = data[0];
      const keys = Object.keys(sample);

      const empKey = keys.find(k => k.toLowerCase().includes('empleado') || k.toLowerCase().includes('employee')) || keys[0];
      const dateKey = keys.find(k => k.toLowerCase().includes('fecha') || k.toLowerCase().includes('date') || k.toLowerCase().includes('imputación') || k.toLowerCase().includes('imputacion')) || keys[1];
      const projKey = keys.find(k => k.toLowerCase().includes('proyecto') || k.toLowerCase().includes('project')) || keys[2];
      const hourKey = keys.find(k => k.toLowerCase().includes('hora') || k.toLowerCase().includes('hour') || k.toLowerCase().includes('imputada')) || keys[3];

      data.forEach(row => {
        const rawEmpleado = String(row[empKey] || '').trim();
        const rawFecha = row[dateKey];
        const rawProyecto = String(row[projKey] || '').trim();
        const rawHoras = parseFloat(row[hourKey]) || 0;

        if (!rawEmpleado || rawEmpleado === '' || rawEmpleado.toLowerCase() === 'undefined') return;

        // Limpieza Empleado
        let empleado = rawEmpleado;
        if (rawEmpleado.includes('-')) {
          empleado = rawEmpleado.substring(rawEmpleado.indexOf('-') + 1).trim();
        }
        if (empleado.includes(',')) {
          const parts = empleado.split(',');
          empleado = `${parts[0].trim()}, ${parts[1].trim()}`;
        }

        // Limpieza Proyecto
        let projectId = 'SIN_ID';
        let projectName = rawProyecto;
        
        const matchProj = rawProyecto.match(/\[(.*?)\]-(.*)/);
        if (matchProj) {
          projectId = matchProj[1].trim();
          projectName = matchProj[2].trim();
        } else if (rawProyecto.includes('-')) {
          const partsP = rawProyecto.split('-');
          projectId = partsP[0].replace(/\[\vert{}\]/g, '').trim();
          projectName = partsP.slice(1).join('-').trim();
        }

        // Formatear Fecha
        let dateObj = new Date(rawFecha);
        let dateFormatted = rawFecha;
        let isoDate = '';

        if (!isNaN(dateObj.getTime())) {
          const day = String(dateObj.getDate()).padStart(2, '0');
          const month = String(dateObj.getMonth() + 1).padStart(2, '0');
          const year = dateObj.getFullYear();
          dateFormatted = `${day}/${month}/${year}`;
          isoDate = `${year}-${month}-${day}`;
        }

        processedRecords.push({
          empleado,
          projectId,
          projectName,
          horas: rawHoras,
          fechaFormateada: dateFormatted,
          isoDate: isoDate,
          rawFecha: dateObj
        });
      });
    }

    function populateProjectFilter() {
      const projects = [...new Set(processedRecords.map(r => r.projectId + ' - ' + r.projectName))].sort();
      const dropdown = document.getElementById('projectDropdown');
      
      let html = `<label class="flex items-center gap-2 p-1.5 hover:bg-slate-100 rounded text-xs font-bold text-slate-700 cursor-pointer border-b mb-1">
        <input type="checkbox" id="selectAllProjects" onchange="toggleSelectAllProjects(this)" checked> TODOS LOS PROYECTOS
      </label>`;

      projects.forEach((p) => {
        html += `<label class="flex items-center gap-2 p-1.5 hover:bg-slate-100 rounded text-xs text-slate-700 cursor-pointer">
          <input type="checkbox" class="project-checkbox" value="${p}" onchange="onProjectCheckChange()" checked> ${p}
        </label>`;
      });

      dropdown.innerHTML = html;
      selectedProjects = [...projects];
    }

    function toggleProjectDropdown(e) {
      if(e) e.stopPropagation();
      document.getElementById('projectDropdown').classList.toggle('hidden');
    }

    function closeDropdownIfOutside(e) {
      const container = document.getElementById('projectDropdownContainer');
      const dropdown = document.getElementById('projectDropdown');
      if (container && dropdown && !container.contains(e.target)) {
        dropdown.classList.add('hidden');
      }
    }

    function toggleSelectAllProjects(master) {
      const checkboxes = document.querySelectorAll('.project-checkbox');
      checkboxes.forEach(cb => cb.checked = master.checked);
      onProjectCheckChange();
    }

    function onProjectCheckChange() {
      const checkboxes = document.querySelectorAll('.project-checkbox');
      selectedProjects = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
      
      const label = document.getElementById('selectedProjectsLabel');
      if (selectedProjects.length === checkboxes.length) {
        label.textContent = "Todos los proyectos";
      } else if (selectedProjects.length === 0) {
        label.textContent = "Ningún proyecto";
      } else {
        label.textContent = `${selectedProjects.length} seleccionados`;
      }
      
      applyFilters();
    }

    function applyFilters() {
      const startDate = document.getElementById('filterStartDate').value;
      const endDate = document.getElementById('filterEndDate').value;
      const search = document.getElementById('searchInput').value.toLowerCase();

      const filtered = processedRecords.filter(r => {
        if (startDate && r.isoDate < startDate) return false;
        if (endDate && r.isoDate > endDate) return false;

        const pKey = r.projectId + ' - ' + r.projectName;
        if (!selectedProjects.includes(pKey)) return false;

        if (search) {
          const matchSearch = r.empleado.toLowerCase().includes(search) || 
                              r.projectName.toLowerCase().includes(search) || 
                              r.projectId.toLowerCase().includes(search);
          if (!matchSearch) return false;
        }

        return true;
      });

      renderHierarchicalTable(filtered);
    }

    // TABLA JERÁRQUICA
    function renderHierarchicalTable(data) {
      const contentArea = document.getElementById('contentArea');
      
      if (data.length === 0) {
        contentArea.innerHTML = '<div class="p-8 bg-white rounded-xl border text-center text-slate-500">No se encontraron registros con los filtros seleccionados.</div>';
        document.getElementById('kpiTotalHours').textContent = '0 h';
        document.getElementById('kpiTotalProjects').textContent = '0';
        document.getElementById('kpiTotalEmployees').textContent = '0';
        return;
      }

      const projectsGroup = {};
      let totalHoursSum = 0;
      const uniqueEmps = new Set();

      data.forEach(r => {
        const projKey = `${r.projectId}|||${r.projectName}`;
        if (!projectsGroup[projKey]) {
          projectsGroup[projKey] = {
            projectId: r.projectId,
            projectName: r.projectName,
            totalHoras: 0,
            empleadosMap: {}
          };
        }

        projectsGroup[projKey].totalHoras += r.horas;
        totalHoursSum += r.horas;
        uniqueEmps.add(r.empleado);

        const empMap = projectsGroup[projKey].empleadosMap;
        if (!empMap[r.empleado]) {
          empMap[r.empleado] = {
            empleado: r.empleado,
            horasEmpleado: 0,
            dias: []
          };
        }
        empMap[r.empleado].horasEmpleado += r.horas;
        empMap[r.empleado].dias.push(r);
      });

      const uniqueProjsCount = Object.keys(projectsGroup).length;

      document.getElementById('kpiTotalHours').textContent = `${totalHoursSum.toFixed(1)} h`;
      document.getElementById('kpiTotalProjects').textContent = uniqueProjsCount;
      document.getElementById('kpiTotalEmployees').textContent = uniqueEmps.size;

      let html = `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-slate-200">
            <thead class="bg-slate-50">
              <tr>
                <th class="px-4 py-3 text-center text-xs font-semibold text-slate-500 uppercase w-12">+</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase">ID Proyecto</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase">Nombre del Proyecto</th>
                <th class="px-6 py-3 text-center text-xs font-semibold text-slate-500 uppercase">Personas Asignadas</th>
                <th class="px-6 py-3 text-right text-xs font-semibold text-slate-500 uppercase">Horas Cargadas</th>
              </tr>
            </thead>
            <tbody class="bg-white divide-y divide-slate-200">`;

      Object.keys(projectsGroup).forEach((projKey, pIdx) => {
        const proj = projectsGroup[projKey];
        const projRowId = `proj_${pIdx}`;
        const empleadosList = Object.values(proj.empleadosMap);

        html += `
          <!-- FILA NIVEL 1: PROYECTO -->
          <tr class="hover:bg-blue-50/50 transition cursor-pointer" onclick="toggleRow('${projRowId}')">
            <td class="px-4 py-4 text-center text-blue-600 font-bold text-lg">
              <span id="icon_${projRowId}">＋</span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-slate-800">${proj.projectId}</td>
            <td class="px-6 py-4 text-sm font-semibold text-slate-700">${proj.projectName}</td>
            <td class="px-6 py-4 text-center text-sm text-slate-600">
              <span class="px-2.5 py-1 bg-slate-100 rounded-full text-xs font-bold text-slate-700">${empleadosList.length} pers.</span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-right font-bold text-blue-600">${proj.totalHoras.toFixed(1)} h</td>
          </tr>

          <!-- DESPLIEGUE NIVEL 2: EMPLEADOS DEL PROYECTO -->
          <tr id="${projRowId}" class="hidden bg-slate-50 border-b border-slate-200">
            <td colspan="5" class="p-4">
              <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-inner ml-6">
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Personas asignadas a ${proj.projectId}</h4>
                
                <table class="min-w-full divide-y divide-slate-200">
                  <thead class="bg-slate-100">
                    <tr>
                      <th class="px-3 py-2 text-center text-xs font-semibold text-slate-500 w-10">+</th>
                      <th class="px-4 py-2 text-left text-xs font-semibold text-slate-500">Nombre Empleado</th>
                      <th class="px-4 py-2 text-right text-xs font-semibold text-slate-500">Horas en Proyecto</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">`;

        empleadosList.forEach((emp, eIdx) => {
          const empRowId = `emp_${pIdx}_${eIdx}`;

          html += `
            <!-- FILA NIVEL 2: EMPLEADO -->
            <tr class="hover:bg-slate-50 transition cursor-pointer" onclick="event.stopPropagation(); toggleRow('${empRowId}')">
              <td class="px-3 py-2 text-center text-blue-600 font-bold">
                <span id="icon_${empRowId}">＋</span>
              </td>
              <td class="px-4 py-2 text-sm font-medium text-slate-800">${emp.empleado}</td>
              <td class="px-4 py-2 text-sm text-right font-bold text-slate-700">${emp.horasEmpleado.toFixed(1)} h</td>
            </tr>

            <!-- DESPLIEGUE NIVEL 3: DÍAS DEL EMPLEADO EN EL PROYECTO -->
            <tr id="${empRowId}" class="hidden bg-blue-50/30">
              <td colspan="3" class="px-6 py-3">
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 ml-6">
                  <h5 class="text-xs font-bold text-slate-500 mb-2">Desglose por Fecha (${emp.empleado})</h5>
                  <table class="min-w-full divide-y divide-slate-200 text-xs">
                    <thead>
                      <tr class="text-slate-400">
                        <th class="py-1 text-left font-semibold">Fecha Imputación</th>
                        <th class="py-1 text-right font-semibold">Horas Cargadas</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">`;

          emp.dias.sort((a,b) => b.rawFecha - a.rawFecha).forEach(d => {
            html += `
              <tr>
                <td class="py-1.5 text-slate-600">${d.fechaFormateada}</td>
                <td class="py-1.5 text-right font-semibold text-slate-800">${d.horas.toFixed(1)} h</td>
              </tr>`;
          });

          html += `
                    </tbody>
                  </table>
                </div>
              </td>
            </tr>`;
        });

        html += `
                  </tbody>
                </table>
              </div>
            </td>
          </tr>`;
      });

      html += `</tbody></table></div></div>`;
      contentArea.innerHTML = html;
    }

    function toggleRow(rowId) {
      const row = document.getElementById(rowId);
      const icon = document.getElementById(`icon_${rowId}`);
      if (row.classList.contains('hidden')) {
        row.classList.remove('hidden');
        if (icon) icon.textContent = '－';
      } else {
        row.classList.add('hidden');
        if (icon) icon.textContent = '＋';
      }
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
